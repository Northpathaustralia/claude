      <circle cx="100" cy="30" r="28" fill="#090909"/><text x="100" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="#F1EEE6">TS</text>
      <circle cx="170" cy="30" r="28" fill="#090909"/><rect x="156" y="26" width="28" height="8" fill="#1747FF"/>
      <circle cx="240" cy="30" r="28" fill="#090909"/><circle cx="240" cy="30" r="10" fill="none" stroke="#FF4A1F" stroke-width="4"/>
      <text x="30" y="84" text-anchor="middle" font-size="8" fill="#090909">DROPS</text>
