    <text x="24" y="162" font-size="10" letter-spacing="2" fill="#BFC0BA">GIFT CARD · CHANGE THEIR STATE</text>
    <text x="24" y="192" font-size="12" letter-spacing="3" fill="#F1EEE6">$ • • •</text>
  </g>

