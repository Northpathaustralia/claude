    <rect x="46" y="60" width="20" height="70" fill="#090909"/>
    <rect x="78" y="82" width="20" height="48" fill="#090909"/>
    <rect x="110" y="104" width="20" height="26" fill="#FF4A1F"/>
    <text x="90" y="170" text-anchor="middle" font-size="9" letter-spacing="2" fill="#090909">FLAT EMBROIDERY · MADEIRA 40WT</text>
  </g>

  <!-- 3. NECK LABEL -->
  <g transform="translate(640,110)">
    <text y="-8" font-size="13" font-weight="700" fill="#090909">3 · NECK LABEL (60×60mm woven damask)</text>
    <rect x="0" y="10" width="170" height="170" fill="#090909"/>
    <text x="85" y="70" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="2" fill="#F1EEE6">TIDESTATE</text>
    <rect x="30" y="84" width="80" height="2" fill="#BFC0BA"/>
    <rect x="112" y="81" width="28" height="6" fill="#1747FF"/>
    <text x="85" y="118" text-anchor="middle" font-size="22" font-weight="800" fill="#F1EEE6">L</text>
    <text x="85" y="150" text-anchor="middle" font-size="8" letter-spacing="2" fill="#BFC0BA">COASTFORM CONSTRUCTION</text>
  </g>

