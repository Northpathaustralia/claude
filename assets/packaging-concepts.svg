    </g>
    <g font-family="'Space Grotesk',monospace" font-size="8" fill="#090909" letter-spacing="1">
      <text x="12" y="52">28.0167°S</text><text x="146" y="52">153.4000°E</text>
      <text x="76" y="102">TIDESTATE</text><text x="214" y="102">28.0167°S</text>
      <text x="12" y="152">153.4000°E</text><text x="146" y="152">TIDESTATE</text>
      <text x="76" y="200">28.0167°S</text><text x="214" y="200">153.4000°E</text>
    </g>
  </g>

  <!-- 9. THANK-YOU CARD -->
  <g transform="translate(380,830)">
    <text y="-8" font-size="13" font-weight="700" fill="#090909">9 · THANK-YOU CARD (A6, founder note)</text>
    <rect x="0" y="10" width="210" height="148" fill="#090909"/>
    <text x="18" y="46" font-size="14" font-weight="800" letter-spacing="1" fill="#F1EEE6">YOU'RE EARLY.</text>
    <text x="18" y="68" font-size="8.5" fill="#BFC0BA">This company is being built in public — and you</text>
    <text x="18" y="80" font-size="8.5" fill="#BFC0BA">just funded the next sample. Fit feedback? It</text>
    <text x="18" y="92" font-size="8.5" fill="#BFC0BA">changes what we make next. Scan &amp; tell me. — James</text>
    <rect x="18" y="106" width="44" height="44" fill="#F1EEE6"/>
    <text x="70" y="126" font-size="7" letter-spacing="1" fill="#BFC0BA">QR → FIT VIDEOS + REPLY LINE</text>
    <rect x="168" y="118" width="24" height="8" fill="#FF4A1F"/>
  </g>

