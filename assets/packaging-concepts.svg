    <text x="75" y="261" text-anchor="middle" font-size="8" letter-spacing="1" fill="#F1EEE6">SCAN · GARMENT PASSPORT</text>
    <text x="75" y="296" text-anchor="middle" font-size="7" letter-spacing="2" fill="#090909">CHANGE YOUR STATE</text>
  </g>

