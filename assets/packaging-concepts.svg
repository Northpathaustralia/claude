    <rect x="204" y="164" width="36" height="10" fill="#1747FF"/>
    <text x="150" y="200" text-anchor="middle" font-size="10" letter-spacing="2" fill="#090909">28.0167°S / 153.4000°E — GOLD COAST QLD</text>
