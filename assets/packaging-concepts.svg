    <circle cx="75" cy="34" r="6" fill="#ffffff" stroke="#090909"/>
    <text x="75" y="86" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="1" fill="#090909">TIDESTATE</text>
    <g>
      <rect x="35" y="106" width="14" height="44" fill="#090909"/>
      <rect x="55" y="120" width="14" height="30" fill="#090909"/>
      <rect x="75" y="134" width="14" height="16" fill="#FF4A1F"/>
