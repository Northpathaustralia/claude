<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" role="img" aria-label="TIDESTATE packaging and identity concept sheet" font-family="'Archivo','Helvetica Neue',sans-serif">
  <!-- ============================================================
    TIDESTATE — PACKAGING & IDENTITY CONCEPT SHEET
    Concepts at proportional scale. Print specs in docs/MANUFACTURING_BRIEF.md §7.
    Palette: Ink #090909 · Bone #F1EEE6 · Concrete #BFC0BA · Cobalt #1747FF · Signal #FF4A1F
  ============================================================ -->
  <rect width="1200" height="1560" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="800" letter-spacing="3" fill="#090909">TIDESTATE — PACKAGING &amp; IDENTITY CONCEPTS</text>
  <text x="40" y="78" font-size="14" fill="#6b6b66">Concept sheet · production specs in MANUFACTURING_BRIEF.md §7 · all type sets in Archivo / Space Grotesk (SIL OFL)</text>

  <!-- 1. GARMENT EMBLEM (circular) -->
  <g transform="translate(40,110)">
    <text y="-8" font-size="13" font-weight="700" fill="#090909">1 · CIRCULAR GARMENT EMBLEM (woven patch / print, Ø60mm)</text>
    <circle cx="90" cy="100" r="84" fill="#090909"/>
    <circle cx="90" cy="100" r="84" fill="none" stroke="#F1EEE6" stroke-width="3"/>
    <circle cx="90" cy="100" r="66" fill="none" stroke="#F1EEE6" stroke-width="1.5"/>
    <g fill="#F1EEE6">
      <rect x="58" y="78" width="12" height="40"/>
      <rect x="76" y="90" width="12" height="28"/>
      <rect x="94" y="100" width="12" height="18" fill="#FF4A1F"/>
      <rect x="112" y="86" width="12" height="32" fill="#1747FF"/>
    </g>
    <rect x="52" y="122" width="76" height="3" fill="#F1EEE6"/>
    <text x="90" y="148" text-anchor="middle" font-size="11" letter-spacing="3" fill="#F1EEE6">TIDESTATE</text>
    <text x="90" y="163" text-anchor="middle" font-size="7" letter-spacing="2" fill="#BFC0BA">GOLD COAST · 28.0167°S</text>
  </g>

  <!-- 2. EMBROIDERY ICON -->
  <g transform="translate(320,110)">
    <text y="-8" font-size="13" font-weight="700" fill="#090909">2 · SMALL EMBROIDERY ICON (breakline, 20mm, ~1,500 st)</text>
