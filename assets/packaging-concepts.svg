    <text x="265" y="52" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1" fill="#F1EEE6">THE BUILD</text>
    <rect x="240" y="64" width="50" height="50" fill="#F1EEE6"/>
    <text x="265" y="134" text-anchor="middle" font-size="6" letter-spacing="1" fill="#F1EEE6">DAY 14 · FOUNDER LOG</text>
