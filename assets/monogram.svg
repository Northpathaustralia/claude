<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="TS monogram">
  <!--
    TS MONOGRAM — pure geometry, no font dependency (safe at any size,
    embroidery-ready). The T's stem doubles as the S's spine: one continuous
    "channel marker" form. Use tonal (Ink-on-Ink garments), or Ink/Bone.
    Embroidery: 3x3cm at 6,000–7,500 stitches, satin stitch on bars.
  -->
  <rect width="240" height="240" rx="28" fill="#090909"/>
  <!-- T -->
  <g fill="#F1EEE6">
    <rect x="40" y="44" width="108" height="26"/>
    <rect x="81" y="44" width="26" height="152"/>
  </g>
  <!-- S built from stacked signage bars, interlocking the T stem -->
  <g fill="#F1EEE6">
    <rect x="127" y="88" width="72" height="22"/>
    <rect x="127" y="88" width="22" height="34"/>
    <rect x="127" y="122" width="72" height="22" fill="#1747FF"/>
    <rect x="177" y="144" width="22" height="30"/>
    <rect x="127" y="174" width="72" height="22"/>
  </g>
  <!-- signal chip -->
  <rect x="40" y="196" width="18" height="10" fill="#FF4A1F"/>
</svg>
