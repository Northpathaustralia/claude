<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Evenfall</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site"><div class="wrap"><nav class="main" aria-label="Main">
  <span style="font-size:.75rem;letter-spacing:.15em;opacity:.6">SECURE CHECKOUT</span>
  <a class="logo" href="index.html">EVENFALL</a>
  <a href="product.html" style="font-size:.78rem;letter-spacing:.1em;opacity:.7">← BACK</a>
</nav></div></header>

<main class="wrap"><div class="checkout">
  <div>
    <div class="paybtns">
      <button class="btn">Shop&nbsp;Pay</button><button class="btn ghost"> Pay</button><button class="btn ghost">PayPal</button>
    </div>
    <div class="hr-or">OR CONTINUE BELOW</div>
    <div class="panel">
      <h3 class="serif" style="font-size:1.2rem;margin-bottom:18px">Contact &amp; delivery</h3>
      <form class="cform" onsubmit="return false">
        <input type="email" placeholder="Email" aria-label="Email" required>
        <input type="text" placeholder="First name" aria-label="First name" required>
        <input type="text" placeholder="Last name" aria-label="Last name" required>
        <input type="text" placeholder="Address (autocomplete enabled)" aria-label="Address" required>
        <input type="text" placeholder="Suburb, state, postcode" aria-label="Suburb, state and postcode" required>
        <label style="font-size:.85rem"><input type="checkbox" style="width:auto;margin-right:8px"> Text me delivery updates (and nothing else, unless I say so)</label>
        <label style="font-size:.85rem"><input type="checkbox" style="width:auto;margin-right:8px"> This is a gift — wrap it, add a handwritten card, hide the prices</label>
        <h3 class="serif" style="font-size:1.2rem;margin:14px 0 4px">Payment</h3>
        <input type="text" placeholder="Card number" aria-label="Card number" required>
        <button class="btn full" type="submit" onclick="location.href='thank-you.html'">Pay now</button>
      </form>
    </div>
  </div>
  <aside>
    <div class="panel">
      <h3 class="serif" style="font-size:1.2rem;margin-bottom:18px">Your ritual</h3>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(22,22,26,.08)"><span>The Deep Soak</span><span>$64.00</span></div>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(22,22,26,.08)"><span>The Night Balm (bump)</span><span>$19.00</span></div>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(22,22,26,.08)"><span>Shipping</span><span>Free</span></div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;font-weight:600"><span>Total</span><span>$83.00 AUD</span></div>
    </div>
    <div class="trust" style="border:none;gap:20px;font-size:.68rem;margin-top:8px"><span>60-Night Guarantee</span><span>Secure checkout</span><span>AU made</span></div>
  </aside>
</div></main>

<footer class="site" style="padding:32px 0"><div class="wrap"><div class="fbottom"><span>© 2026 Evenfall Pty Ltd</span><span><a href="returns.html">Returns</a> · <a href="privacy.html">Privacy</a></span></div></div></footer>
</body>
</html>
